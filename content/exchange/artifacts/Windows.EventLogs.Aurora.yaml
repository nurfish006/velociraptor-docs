name: Windows.EventLogs.AuroraAgent
author: Wes Lambert - @therealwlambert
description: |
  Detects Aurora Agent activity by searching Windows Application event logs for entries 
  from Nextron Systems' Aurora/Aurora Lite EDR solution (AuroraAgent provider).

  This artifact wraps Windows.EventLogs.EvtxHunter to specifically target Aurora Agent
  event log entries, which can indicate the presence of Nextron's security monitoring
  software on the endpoint.

reference:
   - https://www.nextron-systems.com/aurora/

parameters:
   - name: MessageRegex
     description: "Regex pattern to filter event messages"
     default: .
   - name: TargetGlob
     default: '%SystemRoot%\System32\Winevt\Logs\Application.evtx'
   - name: VSSAnalysisAge
     type: int
     default: 0
     description: |
       If larger than zero we analyze VSS within this many days
       ago. (e.g 7 will analyze all VSS within the last week).  Note
       that when using VSS analysis we have to use the ntfs accessor
       for everything which will be much slower.

sources:
  - precondition:
      SELECT OS From info() where OS = 'windows'

    query: |
      SELECT EventTime,
             Computer,
             Channel,
             Provider,
             EventID,
             EventRecordID,
             EventData,
             Message,
             FullPath
      FROM Artifact.Windows.EventLogs.EvtxHunter(
        EvtxGlob=TargetGlob,
        ProviderRegex="AuroraAgent",
        VSSAnalysisAge=VSSAnalysisAge)
      WHERE Message =~ MessageRegex
